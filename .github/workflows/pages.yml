name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's Pages deployment API intermittently rejects deploys ("try again later").
  # Same-SHA retries reliably fail; a fresh SHA usually succeeds. So on failure, mint
  # an empty commit to retrigger - capped at 2 consecutive heals so a real outage
  # cannot ping-pong forever.
  self-heal:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Re-mint SHA unless the last two commits were already heals
        run: |
          if [ "$(git log -2 --format=%s | grep -c '^Pages redeploy (auto-heal)$')" -ge 2 ]; then
            echo "Two consecutive heal commits already - stopping to avoid a loop."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Pages redeploy (auto-heal)"
          git push
