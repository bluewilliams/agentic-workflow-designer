name: Test & Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Per-ref so a PR run can never cancel (or be cancelled by) a main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole design bets on the suite being green; the deploy now enforces it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the suite (headless Chrome)
        run: ./run-tests.sh --verbose

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's Pages deployment API intermittently rejects deploys ("try again later").
  # Same-SHA retries reliably fail; a fresh SHA usually succeeds. So on failure, mint
  # an empty commit to retrigger - capped at 2 consecutive heals so a real outage
  # cannot ping-pong forever. Guarded to DEPLOY failures only: a red test suite must
  # never be "healed" into a redeploy loop.
  self-heal:
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure() && needs.deploy.result == 'failure'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Re-mint SHA unless the last two commits were already heals
        run: |
          if [ "$(git log -2 --format=%s | grep -c '^Pages redeploy (auto-heal)$')" -ge 2 ]; then
            echo "Two consecutive heal commits already - stopping to avoid a loop."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Pages redeploy (auto-heal)"
          git push
