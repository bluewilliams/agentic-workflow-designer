    expect(gen).toContain('Confluence');
    expect(gen).toContain('linked or duplicate issues');
    expect(gen).toContain('use your judgment');
  });
});

describe('Atlassian two-block scenario matrix', () => {
  // Markers. TF uses the case-robust substring (prose capitalizes "The" at sentence start).
  const TF = 'resolved ticket is the spec';
  const GEN = 'Atlassian (general)';
  const HARDCODED = 'If an Atlassian MCP tool is available';
  const JIRA_URL = 'https://foo.atlassian.net/browse/TEST-1';

  // Each generator built on a 'linear' workflow. resetState() does NOT reset mcpAtlassian,
  // so every test sets it explicitly. URL is plumbed via storyInput unless noted.
  const gens = [
    { name: 'genWorkflow',     fn: () => win.genWorkflow() },
    { name: 'genSubAgents',    fn: () => win.genSubAgents() },
    { name: 'genAgentTeams',   fn: () => win.genAgentTeams() },
    { name: 'genClaudePrompt', fn: () => win.genClaudePrompt() },
  ];

  function setUrl(present) {
    const si = win.document.getElementById('storyInput');
    if (si) si.value = present ? ('Build a feature, see ' + JIRA_URL) : 'Build a feature';
  }

  gens.forEach(g => {
    describe(g.name + ' matrix', () => {
      it('ON + URL -> contains TF and GEN', () => {
        buildTestWorkflow('linear');
        win.state.mcpAtlassian = true;
        setUrl(true);
        const out = g.fn();
        expect(out).toContain(TF);
        expect(out).toContain(GEN);
      });
      it('ON + no URL -> GEN only, no TF', () => {
        buildTestWorkflow('linear');
        win.state.mcpAtlassian = true;
        setUrl(false);
        const out = g.fn();
        expect(out).toNotContain(TF);
        expect(out).toContain(GEN);
      });
      it('OFF + URL -> TF only, no GEN', () => {
        buildTestWorkflow('linear');
        win.state.mcpAtlassian = false;
        setUrl(true);
        const out = g.fn();
        expect(out).toContain(TF);
        expect(out).toNotContain(GEN);
      });
      it('OFF + no URL -> neither TF nor GEN', () => {
        buildTestWorkflow('linear');
        win.state.mcpAtlassian = false;
        setUrl(false);
        const out = g.fn();
        expect(out).toNotContain(TF);
        expect(out).toNotContain(GEN);
      });
    });
  });

  // genAgentSDK: same matrix; TF/GEN live in the # comment block.
  describe('genAgentSDK matrix', () => {
    it('ON + URL -> contains TF and GEN', () => {
      buildTestWorkflow('linear');
      win.state.mcpAtlassian = true;
      setUrl(true);
      const out = win.genAgentSDK();
      expect(out).toContain(TF);
      expect(out).toContain(GEN);
    });
    it('ON + no URL -> GEN only, no TF', () => {
      buildTestWorkflow('linear');
      win.state.mcpAtlassian = true;
      setUrl(false);
      const out = win.genAgentSDK();
      expect(out).toNotContain(TF);
      expect(out).toContain(GEN);
    });
    it('OFF + URL -> TF only, no GEN', () => {
      buildTestWorkflow('linear');
      win.state.mcpAtlassian = false;
      setUrl(true);
      const out = win.genAgentSDK();
      expect(out).toContain(TF);
      expect(out).toNotContain(GEN);
    });
    it('OFF + no URL -> neither TF nor GEN', () => {
      buildTestWorkflow('linear');
      win.state.mcpAtlassian = false;
      setUrl(false);
      const out = win.genAgentSDK();
      expect(out).toNotContain(TF);
      expect(out).toNotContain(GEN);
    });
  });

  // Node-driven URL detection (config.description on the input node), storyInput empty.
  it('detects a Jira URL on an input node config.description', () => {
    const refs = buildTestWorkflow('linear');
    win.state.mcpAtlassian = false;
    const si = win.document.getElementById('storyInput');
    if (si) si.value = '';
    refs.input.config = refs.input.config || {};
    refs.input.config.description = 'Implements ' + JIRA_URL;
    const out = win.genWorkflow();
    expect(out).toContain(TF);
    expect(out).toContain('TEST-1');
  });

  // The PROMPTS templates that had hardcoded Atlassian lines removed.
  describe('PROMPTS templates no longer hardcode Atlassian', () => {
    const edited = ['planner','architect','investigator','reviewer','tester','codebaseExplorer','researcher','testPlanner','testReviewer'];
    edited.forEach(key => {
      it(key + ' template does not contain the hardcoded Atlassian line', () => {
        expect(win.PROMPTS[key]).toNotContain(HARDCODED);
      });
    });
  });

  // Negative control: the Prompt Library reviewer prompt STILL has the hardcoded phrase (untouched).
  it('Prompt Library reviewer prompt STILL contains the hardcoded phrase (proves it is untouched)', () => {
    const lib = win.PROMPT_LIBRARY || [];
    const allPrompts = lib.flatMap(cat => (cat && Array.isArray(cat.prompts)) ? cat.prompts : []);
    const hit = allPrompts.find(p => p && typeof p.prompt === 'string' && p.prompt.indexOf(HARDCODED) !== -1);
    expect(hit !== undefined).toBe(true);
  });

  // Softened guards: URL + toggle off must NOT early-return; output carries the heading + TF.
  it('generateRefinePrompt does NOT early-return on URL + toggle off', () => {
    resetState();
    win.document.getElementById('storyInput').value = JIRA_URL;
    win.document.getElementById('workflowName').value = 'refine-guard';
    win.state.mcpAtlassian = false;
    let copied = '';
    win.navigator.clipboard.writeText = (t) => { copied = t; return Promise.resolve(); };
    win.generateRefinePrompt();
    expect(copied).toContain('Requirements Refinement Interview');
    expect(copied).toContain(TF);
  });
  it('generatePlanPrompt does NOT early-return on URL + toggle off', () => {
    resetState();
    win.document.getElementById('storyInput').value = JIRA_URL;
    win.document.getElementById('workflowName').value = 'plan-guard';
    win.state.mcpAtlassian = false;
    let copied = '';
    win.navigator.clipboard.writeText = (t) => { copied = t; return Promise.resolve(); };
    win.generatePlanPrompt();
    expect(copied).toContain('Implementation Planning');
    expect(copied).toContain(TF);
  });
  it('urlPresetPicker shows for a bare URL even when toggle is off', () => {
    resetState();
    win.document.getElementById('storyInput').value = JIRA_URL;
    win.state.mcpAtlassian = false;
    win.validateStoryInput();
    const picker = win.document.getElementById('urlPresetPicker');
    expect(picker.style.display).toBe('');
  });
});

tCard; window.filterPromptLib = filterPromptLib; window.undo = undo; window.redo = redo; window.validateWorkflow = validateWorkflow; window.estimateTokens = estimateTokens; window.duplicateWorkflow = duplicateWorkflow; window.duplicateNode = duplicateNode; window.disconnectNode = disconnectNode; window.deleteSelected = deleteSelected; window.deleteConnection = deleteConnection; window.genWorkflow = genWorkflow; window.genSubAgents = genSubAgents; window.genAgentTeams = genAgentTeams; window.genAgentSDK = genAgentSDK; window.genClaudePrompt = genClaudePrompt; window.deserializeWorkflow = deserializeWorkflow; window.getWritingStyleDirective = getWritingStyleDirective; window.renderMarkdown = renderMarkdown; window.updatePrompt = updatePrompt; window.getRawPrompt = function() { return _rawPrompt; };';
  win.document.head.appendChild(s);
  // Bypass all confirm() dialogs
  win.confirm = () => true;
  // Clear localStorage to start fresh
  clearStorage();
  resetState();
  // Run tests
  runAll(win);
});
