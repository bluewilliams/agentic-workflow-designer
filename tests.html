<body>
<h1>AWD Test Suite</h1>
<p class="subtitle">Agentic Workflow Designer - iframe-based regression tests</p>
<div class="bar" id="bar"><span class="total">Running&hellip;</span></div>
<div id="results"></div>
<iframe id="app" src="index.html" style="display:none;width:1024px;height:768px"></iframe>

<script>
// ═══════════════════════════════════════════════════════════
// SECTION 2: Minimal Test Framework (zero dependencies)
// ═══════════════════════════════════════════════════════════
const suites = [];
let currentSuite = null;

function describe(name, fn) {
  if (currentSuite) {
    // Nested describe: create a child group inside the parent suite
    const parent = currentSuite;
    const child = { name, tests: [], beforeEach: parent.beforeEach, afterEach: parent.afterEach, parent };
    parent.children = parent.children || [];
    parent.children.push(child);
    currentSuite = child;
    fn();
    currentSuite = parent;
  } else {
    // Top-level describe
    const suite = { name, tests: [], children: [], beforeEach: null, afterEach: null };
    currentSuite = suite;
    suites.push(suite);
    fn();
    currentSuite = null;
  }
}

function it(name, fn) {
  if (!currentSuite) throw new Error('it() must be inside describe()');
  currentSuite.tests.push({ name, fn });
}

function beforeEach(fn) {
  if (!currentSuite) throw new Error('beforeEach() must be inside describe()');
  const inherited = currentSuite.beforeEach;
  currentSuite.beforeEach = inherited ? () => { inherited(); fn(); } : fn;
}

function afterEach(fn) {
  if (!currentSuite) throw new Error('afterEach() must be inside describe()');
  currentSuite.afterEach = fn;
}

class Expectation {
  constructor(actual) { this.actual = actual; }
  toBe(expected) {
    if (this.actual !== expected)
      throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(this.actual)}`);
  }
  toEqual(expected) {
    const a = JSON.stringify(this.actual), b = JSON.stringify(expected);
    if (a !== b) throw new Error(`Expected ${b}, got ${a}`);
  }
  toContain(str) {
    if (typeof this.actual === 'string') {
      if (!this.actual.includes(str))
        throw new Error(`Expected string to contain "${str}".\nGot: "${this.actual.slice(0, 300)}..."`);
    } else if (Array.isArray(this.actual)) {
      if (!this.actual.includes(str))
        throw new Error(`Expected array to contain ${JSON.stringify(str)}`);
    } else {
      throw new Error(`toContain requires string or array, got ${typeof this.actual}`);
    }
  }
  toNotContain(str) {
    if (typeof this.actual === 'string') {
      if (this.actual.includes(str))
        throw new Error(`Expected string NOT to contain "${str}"`);
    } else if (Array.isArray(this.actual)) {
      if (this.actual.includes(str))
        throw new Error(`Expected array NOT to contain ${JSON.stringify(str)}`);
    }
  }
  toBeTruthy() {
    if (!this.actual) throw new Error(`Expected truthy, got ${JSON.stringify(this.actual)}`);
  }
  toBeFalsy() {
    if (this.actual) throw new Error(`Expected falsy, got ${JSON.stringify(this.actual)}`);
  }
  toBeGreaterThan(n) {
    if (!(this.actual > n)) throw new Error(`Expected ${this.actual} > ${n}`);
  }
  toBeLessThan(n) {
    if (!(this.actual < n)) throw new Error(`Expected ${this.actual} < ${n}`);
  }
  toBeNull() {
    if (this.actual !== null) throw new Error(`Expected null, got ${JSON.stringify(this.actual)}`);
  }
  toMatch(regex) {
    if (!regex.test(this.actual))
      throw new Error(`Expected "${String(this.actual).slice(0, 200)}" to match ${regex}`);
  }
  toNotMatch(regex) {
    if (regex.test(this.actual))
      throw new Error(`Expected "${String(this.actual).slice(0, 200)}" NOT to match ${regex}`);
  }
  toBeInstanceOf(cls) {
    if (!(this.actual instanceof cls))
      throw new Error(`Expected instance of ${cls.name}`);
  }
}

function expect(val) { return new Expectation(val); }

async function runAll(win) {
  const t0 = performance.now();
  let totalPass = 0, totalFail = 0;
  const failures = [];
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';

  function runGroup(group, testsDiv, suiteName) {
    let gPass = 0, gFail = 0;
    for (const test of group.tests) {
      try {
        if (group.beforeEach) group.beforeEach();
        test.fn();
        if (group.afterEach) group.afterEach();
        gPass++; totalPass++;
        testsDiv.innerHTML += `<div class="test-row"><span class="icon">✅</span><span class="test-name">${esc(test.name)}</span></div>`;
      } catch (e) {
        gFail++; totalFail++;
        failures.push({ suite: suiteName, test: test.name, error: e.message });
        testsDiv.innerHTML += `<div class="test-row"><span class="icon">❌</span><span class="test-name failed">${esc(test.name)}</span></div>`;
        testsDiv.innerHTML += `<div class="error-detail">${esc(e.message)}</div>`;
      }
    }
    if (group.children) {
      for (const child of group.children) {
        testsDiv.innerHTML += `<div class="test-row" style="padding:6px 0 2px;border-bottom:none"><span style="font-size:11px;font-weight:600;color:var(--text2)">${esc(child.name)}</span></div>`;
        const childResult = runGroup(child, testsDiv, suiteName + ' > ' + child.name);
        gPass += childResult.pass;
        gFail += childResult.fail;
      }
    }
    return { pass: gPass, fail: gFail };
  }

  for (const suite of suites) {
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    const testsDiv = document.createElement('div');
    testsDiv.className = 'tests';

    const { pass: suitePass, fail: suiteFail } = runGroup(suite, testsDiv, suite.name);

    const badge = suiteFail === 0
      ? `<span class="badge green">${suitePass} passed</span>`
      : `<span class="badge red">${suiteFail} failed</span>`;
    summary.innerHTML = `${badge} ${esc(suite.name)} <span style="color:var(--text2);font-weight:400;font-size:11px;margin-left:auto">${suitePass + suiteFail} tests</span>`;
    details.appendChild(summary);
    details.appendChild(testsDiv);
    if (suiteFail > 0) details.open = true;
    resultsEl.appendChild(details);
  }

  const elapsed = (performance.now() - t0).toFixed(0);
  const bar = document.getElementById('bar');
  bar.innerHTML = `<span class="pass">✅ ${totalPass} passed</span>`
    + (totalFail > 0 ? `<span class="fail">❌ ${totalFail} failed</span>` : '')
    + `<span class="total">${totalPass + totalFail} total</span>`
    + `<span class="time">${elapsed}ms</span>`;

  // CLI-readable output: hidden element + console for headless Chrome
  const cliData = { pass: totalPass, fail: totalFail, total: totalPass + totalFail, elapsed, failures };
  const cliEl = document.createElement('pre');
  cliEl.id = 'cli-output';
  cliEl.style.display = 'none';
  cliEl.textContent = JSON.stringify(cliData);
  document.body.appendChild(cliEl);
  console.log('TEST_RESULT:' + JSON.stringify(cliData));
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// SECTION 3: Test Helpers
// ═══════════════════════════════════════════════════════════
let win; // set on iframe load

function resetState() {
  win.state.nodes = [];
  win.state.connections = [];
  win.state.selectedId = null;
  win.state.mode = 'select';
  win.state.connectFrom = null;
  win.state.pan = { x: 0, y: 0 };
  win.state.zoom = 1;
  win.state.nextId = 1;
  win.state.dragging = null;
  win.state.isPanning = false;
  win.state.mousePos = { x: 0, y: 0 };
  win.state.exportFormat = 'prompt';
  win.state.memoryEnabled = false;
  win.state.durableRecord = false;
  win.state.artifactPath = '';
  win.state.defaultModel = 'opus-4.6';
  win.state.repositories = [];
  win.state.activePreset = null;
  win.state.mcpCodeSearch = true;  // app default is ON (index.html state init)
  win.state.mcpDatadog = false;    // app default is OFF (opt-in)
  win.state.rulesPaths = [];       // repo context paths default empty (or undefined in tests)
  win.state.productDocPaths = [];
  // Reset DOM inputs
  const wfName = win.document.getElementById('workflowName');
  if (wfName) wfName.value = '';
  const storyInput = win.document.getElementById('storyInput');
  if (storyInput) storyInput.value = '';
  const memToggle = win.document.getElementById('memoryToggle');
  if (memToggle) memToggle.checked = false;
  const memPath = win.document.getElementById('memoryPathField');
  if (memPath) memPath.style.display = 'none';
  const durToggle = win.document.getElementById('durableRecordToggle');
  if (durToggle) durToggle.checked = false;
  const artField = win.document.getElementById('artifactPathField');
  if (artField) artField.style.display = 'none';
  const artInput = win.document.getElementById('artifactPathInput');
  if (artInput) artInput.value = '';
}

function clearStorage() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('awd_')) keys.push(k);
  }
  keys.forEach(k => localStorage.removeItem(k));
}

function buildTestWorkflow(shape) {
  resetState();
  const refs = {};

  if (shape === 'linear') {
    refs.input = win.addNode('input', 100, 200, 'Requirements');
    refs.planner = win.addNode('agent', 350, 200, 'Planner', { agentType:'planner', model:'opus-4.6', tools:['Read','Grep','Glob'], prompt:'Plan it.', maxTurns:5 });
    refs.implementer = win.addNode('agent', 600, 200, 'Implementer', { agentType:'coder', model:'opus-4.6', tools:['Read','Write','Edit'], prompt:'Build it.', maxTurns:10 });
    refs.output = win.addNode('output', 850, 200, 'Done', { deliverable:'Tested code', format:'code' });
    win.addConnection(refs.input.id, refs.planner.id);
    win.addConnection(refs.planner.id, refs.implementer.id);
    win.addConnection(refs.implementer.id, refs.output.id);
  }

  if (shape === 'parallel') {
    refs.input = win.addNode('input', 100, 250, 'Spec');
    refs.fork = win.addNode('parallel', 350, 250, 'Fork', { strategy:'all' });
    refs.backend = win.addNode('agent', 600, 150, 'Backend', { agentType:'backend', model:'opus-4.6', tools:['Read','Write','Edit','Bash'], prompt:'Backend work.', maxTurns:10 });
    refs.frontend = win.addNode('agent', 600, 350, 'Frontend', { agentType:'frontend', model:'opus-4.6', tools:['Read','Write','Edit'], prompt:'Frontend work.', maxTurns:10 });
    refs.reviewer = win.addNode('agent', 850, 250, 'Reviewer', { agentType:'reviewer', model:'opus-4.6', tools:['Read','Grep'], prompt:'Review it.', maxTurns:5 });
    refs.output = win.addNode('output', 1100, 250, 'Ready', { deliverable:'Full stack', format:'code' });
    win.addConnection(refs.input.id, refs.fork.id);
    win.addConnection(refs.fork.id, refs.backend.id);
    win.addConnection(refs.fork.id, refs.frontend.id);
    win.addConnection(refs.backend.id, refs.reviewer.id);
    win.addConnection(refs.frontend.id, refs.reviewer.id);
    win.addConnection(refs.reviewer.id, refs.output.id);
  }

  if (shape === 'decision') {
    refs.input = win.addNode('input', 100, 200, 'Bug Report');
    refs.implementer = win.addNode('agent', 350, 200, 'Implementer', { agentType:'coder', model:'opus-4.6', tools:['Read','Write','Edit'], prompt:'Fix it.', maxTurns:10 });
    refs.reviewer = win.addNode('agent', 600, 200, 'Reviewer', { agentType:'reviewer', model:'opus-4.6', tools:['Read','Grep'], prompt:'Review it.', maxTurns:5 });
    refs.decision = win.addNode('decision', 850, 200, 'Review OK?', { condition:'All checks pass', yesLabel:'Pass', noLabel:'Revise', maxRevisions:3 });
    refs.tester = win.addNode('agent', 1100, 200, 'Tester', { agentType:'tester', model:'opus-4.6', tools:['Read','Bash'], prompt:'Test it.', maxTurns:10 });
    refs.output = win.addNode('output', 1350, 200, 'Fixed', { deliverable:'Verified fix', format:'code' });
    win.addConnection(refs.input.id, refs.implementer.id);
    win.addConnection(refs.implementer.id, refs.reviewer.id);
    win.addConnection(refs.reviewer.id, refs.decision.id);
    win.addConnection(refs.decision.id, refs.implementer.id, 'Revise');
    win.addConnection(refs.decision.id, refs.tester.id, 'Pass');
    win.addConnection(refs.tester.id, refs.output.id);
  }

  if (shape === 'complex') {
    refs.input = win.addNode('input', 100, 300, 'Spec');
    refs.planner = win.addNode('agent', 350, 300, 'Planner', { agentType:'planner', model:'opus-4.6', tools:['Read','Grep','Glob'], prompt:'Plan.', maxTurns:5 });
    refs.fork = win.addNode('parallel', 600, 300, 'Fork', { strategy:'all' });
    refs.backend = win.addNode('agent', 850, 200, 'Backend', { agentType:'backend', model:'opus-4.6', tools:['Read','Write','Edit','Bash'], prompt:'API.', maxTurns:15 });
    refs.frontend = win.addNode('agent', 850, 400, 'Frontend', { agentType:'frontend', model:'opus-4.6', tools:['Read','Write','Edit'], prompt:'UI.', maxTurns:15 });
    refs.reviewer = win.addNode('agent', 1100, 300, 'Reviewer', { agentType:'reviewer', model:'opus-4.6', tools:['Read','Grep'], prompt:'Review.', maxTurns:5 });
    refs.decision = win.addNode('decision', 1350, 300, 'Review OK?', { condition:'All checks pass', yesLabel:'Pass', noLabel:'Revise', maxRevisions:3 });
    refs.tester = win.addNode('agent', 1600, 300, 'Tester', { agentType:'tester', model:'opus-4.6', tools:['Read','Bash'], prompt:'Test.', maxTurns:10 });
    refs.output = win.addNode('output', 1850, 300, 'Complete', { deliverable:'Tested feature', format:'code' });
    win.addConnection(refs.input.id, refs.planner.id);
    win.addConnection(refs.planner.id, refs.fork.id);
    win.addConnection(refs.fork.id, refs.backend.id);
    win.addConnection(refs.fork.id, refs.frontend.id);
    win.addConnection(refs.backend.id, refs.reviewer.id);
    win.addConnection(refs.frontend.id, refs.reviewer.id);
    win.addConnection(refs.reviewer.id, refs.decision.id);
    win.addConnection(refs.decision.id, refs.backend.id, 'Revise');
    win.addConnection(refs.decision.id, refs.tester.id, 'Pass');
    win.addConnection(refs.tester.id, refs.output.id);
  }

  return refs;
}

// Helper: simulate selecting a value in a custom-select dropdown
function selectCustomOption(container, value) {
  const opt = container.querySelector(`.custom-select-option[data-value="${value}"]`);
  if (opt) opt.click();
}

// ═══════════════════════════════════════════════════════════
// SECTION 4: Test Suites
// ═══════════════════════════════════════════════════════════

// ─── Suite 1: Pure Utilities ─────────────────────────────
describe('Pure Utilities', () => {
  describe('slugify', () => {
    it('should convert spaces to hyphens and lowercase', () => {
      expect(win.slugify('Hello World')).toBe('hello-world');
    });
    it('should strip special characters', () => {
      expect(win.slugify('Hello @#$ World!')).toBe('hello-world');
    });
    it('should remove leading and trailing hyphens', () => {
      expect(win.slugify('--hello--')).toBe('hello');
    });
    it('should return untitled for empty string', () => {
      expect(win.slugify('')).toBe('untitled');
    });
    it('should return untitled for all-special chars', () => {
      expect(win.slugify('@#$%^&')).toBe('untitled');
    });
    it('should preserve numbers', () => {
      expect(win.slugify('Agent 42 v2')).toBe('agent-42-v2');
    });
  });

  describe('extractAcceptanceCriteria', () => {
    it('should extract bullet criteria under AC header', () => {
      const text = 'Acceptance criteria:\n- Should validate email\n- Must return 200\nOther stuff here';
      const result = win.extractAcceptanceCriteria(text);
      expect(result.length).toBe(2);
      expect(result[0]).toContain('validate email');
    });
    it('should extract numbered list criteria', () => {
      const text = 'Acceptance criteria:\n1. User can log in\n2. Error message displays on failure';
      const result = win.extractAcceptanceCriteria(text);
      expect(result.length).toBe(2);
    });
    it('should extract checkbox criteria', () => {
      const text = 'Acceptance criteria:\n- [ ] Should render correctly\n- [x] Must handle errors';
      const result = win.extractAcceptanceCriteria(text);
      expect(result.length).toBe(2);
    });
    it('should return empty array when no criteria found', () => {
      const result = win.extractAcceptanceCriteria('Just some plain text with no criteria.');
      expect(result.length).toBe(0);
    });
  });

  describe('isUrlOnly', () => {
    it('should detect URL-only input', () => {
      expect(win.isUrlOnly('https://jira.example.com/browse/PROJ-123')).toBe(true);
    });
    it('should reject plain text', () => {
      expect(win.isUrlOnly('Fix the login bug in the authentication module')).toBe(false);
    });
    it('should reject mixed URL and text', () => {
      expect(win.isUrlOnly('Check this ticket https://jira.example.com/browse/PROJ-123 and fix it please')).toBe(false);
    });
  });

  describe('isJiraKeyOnly', () => {
    it('should detect a single Jira key', () => {
      expect(win.isJiraKeyOnly('ACME-42')).toBe(true);
    });
    it('should detect multiple Jira keys', () => {
      expect(win.isJiraKeyOnly('ACME-42 PROJ-456')).toBe(true);
    });
    it('should reject plain text', () => {
      expect(win.isJiraKeyOnly('Fix the login bug')).toBe(false);
    });
    it('should reject a Jira key with meaningful prose', () => {
      expect(win.isJiraKeyOnly('ACME-42: fix the login bug in auth module')).toBe(false);
    });
    it('should reject lowercase key-like strings', () => {
      expect(win.isJiraKeyOnly('abc-123')).toBe(false);
    });
    it('should reject URLs', () => {
      expect(win.isJiraKeyOnly('https://team.atlassian.net/browse/ACME-42')).toBe(false);
    });
  });

  describe('getEffectivePrompt', () => {
    it('should prefer user prompt over template', () => {
      const node = { label:'Test', config:{ prompt:'My custom prompt', agentType:'coder', notes:'' }};
      expect(win.getEffectivePrompt(node)).toBe('My custom prompt');
    });
    it('should fall back to agent type template', () => {
      const node = { label:'Test', config:{ prompt:'', agentType:'planner', notes:'' }};
      const result = win.getEffectivePrompt(node);
      expect(result).toContain('implementation plan');
    });
    it('should use generic fallback for unmapped agent types', () => {
      const node = { label:'My Agent', config:{ prompt:'', agentType:'unknown_type_xyz', notes:'' }};
      const result = win.getEffectivePrompt(node);
      expect(result).toContain('Complete the task');
    });
  });

  describe('writer agent type', () => {
    it('should include writer in AGENT_TYPES', () => {
      const writer = win.AGENT_TYPES.find(a => a.id === 'writer');
      expect(!!writer).toBe(true);
      expect(writer.name).toBe('Writer');
      expect(win.AGENT_TYPES.length).toBe(13);
    });
    it('should return technical prompt for default style', () => {
      const node = { label:'Writer', config:{ prompt:'', agentType:'writer', notes:'' }};
      const result = win.getEffectivePrompt(node);
      expect(result).toContain('technical writer');
    });
    it('should return style-specific prompt for writingStyle', () => {
      const node = { label:'Writer', config:{ prompt:'', agentType:'writer', writingStyle:'business', notes:'' }};
      const result = win.getEffectivePrompt(node);
      expect(result).toContain('business writer');
    });
    it('should prefer custom prompt over template', () => {
      const node = { label:'Writer', config:{ prompt:'My custom writing prompt', agentType:'writer', writingStyle:'api', notes:'' }};
      expect(win.getEffectivePrompt(node)).toBe('My custom writing prompt');
    });
    it('should have PROMPTS key for each WRITING_STYLES entry', () => {
      win.WRITING_STYLES.forEach(s => {
        const key = 'writer' + win.capitalize(s.id);
        expect(!!win.PROMPTS[key]).toBe(true);
      });
    });
    it('should have WRITER_TOOL_DEFAULTS for each writing style', () => {
      win.WRITING_STYLES.forEach(s => {
        expect(Array.isArray(win.WRITER_TOOL_DEFAULTS[s.id])).toBe(true);
        expect(win.WRITER_TOOL_DEFAULTS[s.id].length > 0).toBe(true);
      });
    });
  });

  describe('getModelLabel', () => {
    it('should return correct label for known models', () => {
      expect(win.getModelLabel('opus-4.6')).toBe('Opus 4.6');
      expect(win.getModelLabel('sonnet-4.6')).toBe('Sonnet 4.6');
      expect(win.getModelLabel('haiku')).toBe('Haiku 4.5');
    });
    it('should return correct label and id for Fable 5 (and 1M variant)', () => {
      expect(win.getModelLabel('fable-5')).toBe('Fable 5');
      expect(win.getModelLabel('fable-5-1m')).toBe('Fable 5 [1M]');
      expect(win.getModelId('fable-5')).toBe('claude-fable-5');
      expect(win.getModelId('fable-5-1m')).toBe('claude-fable-5');
      expect(win.getModelFamily('fable-5-1m')).toBe('fable-5');
    });
  });

  describe('default model', () => {
    it('ships defaulted to Opus 4.8; Fable 5 was added but is not the default', () => {
      // Shipped default trigger (index.html) reads Opus 4.8, not Fable 5.
      expect(win.document.getElementById('defaultModelTrigger').textContent).toContain('Opus 4.8');
      // Opus 4.8 entry is intact - Fable was added alongside, not substituted in.

    });
  });

  describe('deserializeWorkflow', () => {
    it('should preserve fidelity in serialize/deserialize roundtrip', () => {
      buildTestWorkflow('linear');
      const data = win.serializeWorkflow();
      resetState();
      expect(win.state.nodes.length).toBe(0);
      const ok = win.deserializeWorkflow(data);
      expect(ok).toBe(true);
      expect(win.state.nodes.length).toBe(4);
    });
    it('should reject data with missing canvas', () => {
      const ok = win.deserializeWorkflow({ version: 1 });
      expect(ok).toBe(false);
    });
    it('should reject data with invalid node types', () => {
      const ok = win.deserializeWorkflow({
        canvas: { nodes: [{ id:'n1', type:'banana', label:'Bad', x:0, y:0, w:100, h:50, config:{} }], connections:[], nextId:2 }
      });
      expect(ok).toBe(false);
    });
    it('should restore memoryEnabled to checkbox and state', () => {
      const data = { version:1, memoryEnabled:true, canvas:{ nodes:[], connections:[], nextId:1, pan:{x:0,y:0}, zoom:1 }};
      win.deserializeWorkflow(data);
      expect(win.state.memoryEnabled).toBe(true);
      const cb = win.document.getElementById('memoryToggle');
      if (cb) expect(cb.checked).toBe(true);
    });
    // Export/import, save/load, clone, autosave, and the handoff bundle ALL funnel through
    // serialize -> deserialize. Confirm Skeptic/Verifier prompts (now baked into config.prompt)
    // survive the round-trip and the generated output is byte-identical.
    it('preserves Skeptic/Verifier config.prompt and generated output across a round-trip', () => {
      win.loadPreset('delivery_swarm'); // has a Skeptic (Lead Planner) and a Verifier (Integrator)
      win.document.getElementById('workflowName').value = 'roundtrip-test';
      const sk0 = win.state.nodes.find(n => /Skeptic review/.test(n.label));
      const vf0 = win.state.nodes.find(n => /Verification/.test(n.label));
      expect((sk0.config.prompt || '').trim().length).toBeGreaterThan(0);
      expect((vf0.config.prompt || '').trim().length).toBeGreaterThan(0);
      const skPrompt = sk0.config.prompt, vfPrompt = vf0.config.prompt;
      const genBefore = win.genWorkflow();
      const subBefore = win.genSubAgents();
      // JSON clone == what export/import, save/load, clone, autosave all do
      const json = JSON.parse(JSON.stringify(win.serializeWorkflow()));
      resetState();
      expect(win.deserializeWorkflow(json)).toBe(true);
      const sk1 = win.state.nodes.find(n => /Skeptic review/.test(n.label));
      const vf1 = win.state.nodes.find(n => /Verification/.test(n.label));
      expect(sk1.config.prompt).toBe(skPrompt);
      expect(vf1.config.prompt).toBe(vfPrompt);
      expect(win.getEffectivePrompt(sk1)).toBe(skPrompt);
      expect(win.getEffectivePrompt(vf1)).toBe(vfPrompt);
      expect(win.classifyAgentPrompt(sk1).state).toBe('template'); // not 'empty'
      expect(win.classifyAgentPrompt(vf1).state).toBe('template');
      expect(win.genWorkflow()).toBe(genBefore);     // generated output unchanged after round-trip
      expect(win.genSubAgents()).toBe(subBefore);
      // the Skeptic's actual prompt text rides along in the generated prompt
      expect(win.genWorkflow()).toContain(skPrompt.split('\n')[0]);
    });
  });

  describe('savePrefs / restorePrefs', () => {
    it('should roundtrip preferences through save and restore', () => {
      win.state.defaultModel = 'sonnet-4.6';
      win.state.memoryEnabled = true;
      win.state.exportFormat = 'sdk';
      win.savePrefs();
      win.state.defaultModel = 'opus-4.6';
      win.state.memoryEnabled = false;
      win.state.exportFormat = 'prompt';
      win.restorePrefs();
      expect(win.state.exportFormat).toBe('sdk');
    });
    it('should handle missing memoryEnabled in prefs gracefully', () => {
      localStorage.setItem('awd_prefs', JSON.stringify({ defaultModel:'opus-4.6' }));
      win.restorePrefs();
    });
    it('should restore false memoryEnabled explicitly', () => {
      win.state.memoryEnabled = false;
      win.savePrefs();
      win.state.memoryEnabled = true;
      win.restorePrefs();
      expect(win.state.memoryEnabled).toBe(false);
    });
    it('should not clobber a saved default-false toggle during restore (clarifyFirst regression)', () => {
      // setExportFormat/setDefaultModel call savePrefs early in restorePrefs, before clarifyFirst
      // is restored. Without the _restoring guard that early save wrote the default (false) back
      // over the saved true, so the toggle silently failed to persist across the NEXT reload.
      localStorage.setItem('awd_prefs', JSON.stringify({ clarifyFirst: true, exportFormat: 'sdk' }));
      win.restorePrefs();
      expect(win.state.clarifyFirst).toBe(true);
      const after = JSON.parse(localStorage.getItem('awd_prefs'));
      expect(after.clarifyFirst).toBe(true);
    });
  });

  describe('workflow save/load', () => {
    it('should roundtrip through auto-save', () => {
      buildTestWorkflow('linear');
      localStorage.setItem('awd_autosave', JSON.stringify(win.serializeWorkflow()));
      resetState();
      const ok = win.restoreAutoSave();
      expect(ok).toBe(true);
      expect(win.state.nodes.length).toBe(4);
    });
    it('should return empty workflow index by default', () => {
      const idx = win.getWorkflowIndex();
      expect(idx.length).toBe(0);
    });
    it('should save by name and load by slug', () => {
      buildTestWorkflow('decision');
      win.document.getElementById('workflowName').value = 'Test Flow';
      const data = win.serializeWorkflow();
      const slug = data.slug;
      const key = 'awd_wf_' + slug;
      localStorage.setItem(key, JSON.stringify(data));
      let index = win.getWorkflowIndex();
      index.push({ slug, name:'Test Flow', savedAt: data.savedAt });
      win.setWorkflowIndex(index);
      resetState();
      const raw = localStorage.getItem(key);
      const loaded = JSON.parse(raw);
      const ok = win.deserializeWorkflow(loaded);
      expect(ok).toBe(true);
      expect(win.state.nodes.filter(n => n.type === 'decision').length).toBe(1);
    });
  });
});

// ─── Delivery is driven by the Output node format (code | commit | pr | report | docs) ───
describe('Delivery is driven by the Output node format', () => {
  beforeEach(() => { resetState(); });

  const COMMITS = 'NEVER commit or push directly to the target branch'; // pr + commit
  const UNCOMMITTED = 'Leave all changes uncommitted on the current branch'; // code / no output
  const OPENS_PR = 'gh pr create'; // pr only
  const NO_PR = 'Do NOT open a pull request'; // commit only
  const NEVER_COMMITS = 'Do NOT commit, push, or open a pull request'; // report + docs
  const generators = ['genWorkflow', 'genSubAgents', 'genAgentTeams', 'genAgentSDK', 'genClaudePrompt'];

  // Per-format expectations applied across every generator. Each generator renders
  // the delivery block (the SDK as # comments), so the substring checks hold for all.
  const CASES = {
    code:   { must: [UNCOMMITTED],                       mustNot: [COMMITS, OPENS_PR] },
    commit: { must: [COMMITS, NO_PR],                    mustNot: [UNCOMMITTED, OPENS_PR] },
    pr:     { must: [COMMITS, OPENS_PR],                 mustNot: [UNCOMMITTED, NO_PR] },
    report: { must: ['Deliverable: a written report', NEVER_COMMITS], mustNot: [COMMITS, UNCOMMITTED, OPENS_PR] },
    docs:   { must: ['Deliverable: documentation', NEVER_COMMITS],    mustNot: [COMMITS, UNCOMMITTED, OPENS_PR] },
  };

  // Minimal input -> agent -> output workflow with the given output format.
  function workflowWithOutput(format) {
    resetState();
    const input = win.addNode('input', 100, 200, 'Requirements');
    const agent = win.addNode('agent', 350, 200, 'Implementer', {});
    const output = win.addNode('output', 600, 200, 'Done', { deliverable: 'Result', format });
    win.addConnection(input.id, agent.id);
    win.addConnection(agent.id, output.id);
  }

  it('the Delivery toggle is gone (commitPr removed)', () => {
    expect(win.document.getElementById('commitPrToggle')).toBe(null);
  });

  generators.forEach(gen => {
    Object.keys(CASES).forEach(format => {
      it(gen + ': a ' + format + ' output renders the matching delivery instructions', () => {
        workflowWithOutput(format);
        const out = win[gen]();
        CASES[format].must.forEach(m => expect(out).toContain(m));
        CASES[format].mustNot.forEach(m => expect(out).toNotContain(m));
      });
    });
  });

  it('deliveryBlock prioritizes pr > commit > report > docs > code on multi-output', () => {
    resetState();
    win.addNode('output', 100, 100, 'A', { deliverable: '', format: 'docs' });
    win.addNode('output', 100, 200, 'B', { deliverable: '', format: 'report' });
    expect(win.deliveryBlock('###')[0]).toBe('### Report'); // report beats docs
    win.addNode('output', 100, 300, 'C', { deliverable: '', format: 'commit' });
    expect(win.deliveryBlock('###')[0]).toBe('### Commit'); // commit beats report
    win.addNode('output', 100, 400, 'D', { deliverable: '', format: 'pr' });
    expect(win.deliveryBlock('###')[0]).toBe('### Pull Request Creation'); // pr beats all
  });

  it('deliveryBlock falls back to the uncommitted block with no output node', () => {
    resetState();
    const block = win.deliveryBlock('###').join('\n');
    expect(block).toContain(UNCOMMITTED);
    expect(win.deliveryTitle()).toBe('Delivery');
  });

  it('the Commit block commits and pushes but never opens a PR', () => {
    workflowWithOutput('commit');
    const block = win.commitBlock('### Commit').join('\n');
    expect(block).toContain('git push -u origin');
    expect(block).toContain(NO_PR);
    expect(block).toNotContain(OPENS_PR);
  });

  it('deliversPr() reflects whether any output is a Pull Request', () => {
    workflowWithOutput('code');
    expect(win.deliversPr()).toBe(false);
    workflowWithOutput('pr');
    expect(win.deliversPr()).toBe(true);
  });
});

// Guards the "I unchecked the box but still see the feature" confusion: when an MCP
// toggle is OFF, NONE of its hint-body strings may appear in ANY exporter. We assert on
// strings unique to the hint BODY (not the generic feature name), because the generic
// name can legitimately appear via the workflow's own title in the memory breadcrumb and
// file paths - that is name-derived, not a hint leak.
describe('MCP toggle leak guard (off = no hint-body strings in any exporter)', () => {
  beforeEach(() => { resetState(); });

  const EXPORTERS = ['genWorkflow', 'genSubAgents', 'genAgentTeams', 'genAgentSDK', 'genClaudePrompt'];

  // Neutral workflow: a planner agent (in both CODE_SEARCH and DATADOG role sets) so the
  // per-agent hints would fire if not gated. The title is generic, so no feature word can
  // leak through a name-derived breadcrumb.
  function neutralWorkflow() {
    resetState();
    const input = win.addNode('input', 100, 200, 'Requirements');
    const agent = win.addNode('agent', 350, 200, 'Builder', { agentType:'planner', model:'opus-4.6', tools:['Read','Grep','LSP'], prompt:'Build it.', maxTurns:5 });
    const output = win.addNode('output', 600, 200, 'Done', { deliverable:'Result', format:'code' });
    win.addConnection(input.id, agent.id);
    win.addConnection(agent.id, output.id);
  }
  function allOutputs() { return EXPORTERS.map(fn => win[fn]()); }

  // Hint-body strings unique to each feature (would never appear in a workflow title).
  const CODE_SEARCH_STRINGS = ['Sourcebot', 'Code search (MCP) is available', 'cross-repo code search'];
  const DATADOG_STRINGS = ['production telemetry', 'If a Datadog MCP server is connected', 'Datadog MCP server is connected'];

  it('code search OFF: no code-search hint-body string in any of the five exporters', () => {
    neutralWorkflow();
    win.state.mcpCodeSearch = false;
    allOutputs().forEach(out => {
      CODE_SEARCH_STRINGS.forEach(s => expect(out).toNotContain(s));
    });
  });

  it('code search ON: hint body is present (positive control - proves the OFF check is meaningful)', () => {
    neutralWorkflow();
    win.state.mcpCodeSearch = true;
    expect(win.genWorkflow()).toContain('Sourcebot');
    expect(win.genWorkflow()).toContain('Code search (MCP) is available');
  });

  it('datadog OFF: no datadog hint-body string in any of the five exporters', () => {
    neutralWorkflow();
    win.state.mcpDatadog = false;
    allOutputs().forEach(out => {
      DATADOG_STRINGS.forEach(s => expect(out).toNotContain(s));
    });
  });

  it('datadog ON: hint body is present (positive control - proves the OFF check is meaningful)', () => {
    neutralWorkflow();
    win.state.mcpDatadog = true;
    expect(win.genWorkflow()).toContain('production telemetry');
    expect(win.genWorkflow()).toContain('If a Datadog MCP server is connected');
  });
});

      { consumeRecords:false, memoryEnabled:true,  durableRecord:true  }, // durable block, no consume prose
      { consumeRecords:true,  memoryEnabled:true,  durableRecord:true  }, // both
    ];

    expect(win.genAgentTeams()).toContain('teammate');
  });
});

// Regression: the autosave snapshot also carries the toggles and is re-applied on reload.
// Toggling a setting updates prefs; it must ALSO refresh the autosave snapshot, otherwise a
// stale snapshot overrides the just-saved toggle on the next load (Durable Record unchecking
// itself was this bug). The fix routes savePrefs() through autoSaveWorkflow().
describe('Autosave stays in sync with toggle changes', () => {
  beforeEach(() => { resetState(); });

  it('toggling Durable Record refreshes the autosave snapshot (savePrefs -> autoSaveWorkflow)', () => {
    buildTestWorkflow('linear'); // nodes exist, so the autosave path writes rather than clears
    const mt = win.document.getElementById('memoryToggle'); mt.checked = true; win.toggleMemory();
    let autosaveCalls = 0;
    const orig = win.autoSaveWorkflow;
    win.autoSaveWorkflow = function() { autosaveCalls++; };
    try {
      const dt = win.document.getElementById('durableRecordToggle');
      dt.checked = true; win.toggleDurableRecord();
    } finally {
      win.autoSaveWorkflow = orig;
    }
    // The toggle re-saved the snapshot...
    expect(autosaveCalls > 0).toBe(true);
    // ...and what it writes reflects the toggle, so a reload restores durable = true.
    expect(win.serializeWorkflow().durableRecord).toBe(true);
  });
});

// ─── Auto Workflow fuzz: hundreds of synthetic requirements ─────────────────
// Two kinds of checks: (1) LABELED templates - random fill-ins but a known intent,
// so we can assert the detected shape; (2) structural INVARIANTS that must hold for
// ANY input. Seeded RNG so a failure is reproducible.
describe('Auto Workflow fuzz (property-based)', () => {
  beforeEach(() => { resetState(); });

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rng = mulberry32(0x5EED);
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const fill = tpl => tpl.replace(/\{(\w+)\}/g, (_, k) => pick(SLOTS[k]));

  const SLOTS = {
    subj: ['checkout flow', 'user onboarding', 'the billing module', 'the notifications feature', 'the search experience', 'account preferences', 'the inventory tracker', 'the loyalty program', 'the messaging feature', 'the export job'],
    bug: ['bug', 'crash', 'regression', 'defect', 'hotfix'],
    uiel: ['button', 'dropdown', 'modal', 'form', 'sidebar', 'navbar', 'tooltip', 'dashboard'],
    tech: ['Kafka', 'RabbitMQ', 'Redis', 'Postgres', 'DynamoDB', 'S3', 'gRPC', 'Snowflake'],
    dev: ['CI/CD pipeline', 'Docker container', 'Kubernetes deployment', 'a deployment pipeline', 'GitHub Actions setup'],
  };

  const CODE_WRITERS = ['Implementer', 'Fixer', 'Backend Dev', 'Frontend Dev', 'UI Implementer', 'Optimizer', 'Migration Engineer', 'Refactorer', 'DevOps Engineer', 'Test Suite Writer', 'Test Writer'];
  // True feature-implementers (excludes Test Suite Writer / Test Writer, whose deliverable IS tests).
  const IMPLEMENTERS = ['Implementer', 'Fixer', 'Backend Dev', 'Frontend Dev', 'UI Implementer', 'Optimizer', 'Migration Engineer', 'Refactorer', 'DevOps Engineer'];

  function shapeOf(nodes) {
    const labels = nodes.filter(n => n.type === 'agent').map(n => n.label);
    const has = re => labels.some(l => re.test(l));
    if (has(/^Investigator$/)) return 'bugfix';
    if (has(/^Refactorer$/)) return 'refactoring';
    if (has(/^Doc Writer$/)) return 'documentation';
    if (has(/^DevOps Engineer$/)) return 'devops';
    if (has(/^Profiler$/) || has(/^Optimizer$/)) return 'performance';
    if (has(/^Migration Engineer$/)) return 'data';
    if (has(/^Test Suite Writer$/)) return 'test';
    if (has(/^Data Gatherer$/)) return 'analysis';
    if (has(/^Synthesizer$/)) return 'research';
    if (has(/^Report Builder$/) || has(/^Quality Reviewer$/)) return 'review';
    if (has(/^Backend Dev$/) && has(/^Frontend Dev$/)) return 'fullstack';
    if (has(/^UI Implementer$/)) return 'ui';
    return 'generic';
  }

  // Invariants that must hold for EVERY generated workflow, whatever the input.
  function assertStructural(nodes, conns) {
    const inputs = nodes.filter(n => n.type === 'input');
    const outputs = nodes.filter(n => n.type === 'output');
    const agents = nodes.filter(n => n.type === 'agent');
    expect(inputs.length).toBe(1);
    expect(outputs.length).toBe(1);
    expect(agents.length).toBeGreaterThan(0);
    const ids = new Set(nodes.map(n => n.id));
    conns.forEach(c => { expect(ids.has(c.from) && ids.has(c.to)).toBe(true); }); // no dangling edge
    expect(conns.some(c => c.from === inputs[0].id)).toBe(true);  // input feeds something
    expect(conns.some(c => c.to === outputs[0].id)).toBe(true);   // output is reached
    agents.forEach(a => {
      expect(conns.some(c => c.to === a.id)).toBe(true);                       // no orphan agent
      expect((win.getEffectivePrompt(a) || '').length).toBeGreaterThan(0);     // never a blank prompt
    });
    expect(['code', 'commit', 'pr', 'report', 'docs'].includes(outputs[0].config.format)).toBe(true);
  }

  const INTENTS = [
    { name: 'bugfix', expected: 'bugfix', tpls: ['Fix the {bug} in {subj}', 'Patch the {bug} affecting {subj}', '{subj} is crashing'] },
    { name: 'refactoring', expected: 'refactoring', tpls: ['Refactor {subj} to reduce complexity', 'Restructure {subj} for clarity'] },
    { name: 'documentation', expected: 'documentation', tpls: ['Document {subj}', 'Write the README for {subj}', 'Add docs for {subj}'] },
    { name: 'devops', expected: 'devops', tpls: ['Set up a {dev} for {subj}', 'Deploy {subj} with Docker'] },
    { name: 'performance', expected: 'performance', tpls: ['Optimize {subj} for latency', 'Speed up {subj}', 'Reduce latency in {subj}'] },
    { name: 'data', expected: 'data', tpls: ['Migrate {subj} to a new schema', 'Write an ETL job for {subj}', 'Create a database migration for {subj}'] },
    { name: 'test', expected: 'test', tpls: ['Write tests for {subj}', 'Add unit tests for {subj}', 'Improve test coverage for {subj}'] },
    { name: 'research', expected: 'research', tpls: ['Research whether to use {tech} for {subj}', 'Compare {tech} versus {tech} for {subj}', 'Evaluate {tech} options for {subj}'] },
    { name: 'review', expected: 'review', tpls: ['Review {subj} for quality issues', 'Audit {subj} for problems', 'Assess {subj} for risks'] },
    { name: 'analysis', expected: 'analysis', tpls: ['Measure usage and forecast the monthly cost for {subj}', 'Estimate the cost of {subj}', 'Forecast spend for {subj} and document the methodology', 'Quantify the cost impact of {subj}'] },
    { name: 'ui', expected: 'ui', tpls: ['Build a {uiel} for {subj}', 'Add a responsive {uiel} to {subj}'] },
    { name: 'fullstack', expected: 'fullstack', tpls: ['Build a {uiel} and a REST API for {subj}', 'Create a {uiel} backed by a GraphQL endpoint for {subj}'] },
  ];

  const N = 22;
  INTENTS.forEach(intent => {
    describe(intent.name, () => {
      for (let i = 0; i < N; i++) {
        const input = fill(pick(intent.tpls));
        it('#' + i + ': ' + input, () => {
          resetState();
          win.document.getElementById('storyInput').value = input;
          win.generateFromStory();
          const nodes = win.state.nodes, conns = win.state.connections;
          assertStructural(nodes, conns);
          expect(shapeOf(nodes)).toBe(intent.expected);
          if (intent.expected === 'research' || intent.expected === 'review' || intent.expected === 'analysis') {
            const out = nodes.find(n => n.type === 'output');
            expect(out.config.format).toBe('report');
            const writers = nodes.filter(n => n.type === 'agent').map(n => n.label).filter(l => CODE_WRITERS.includes(l));
            expect(writers.length).toBe(0); // read-only: never writes code
          } else if (intent.expected !== 'test' && intent.expected !== 'documentation') {
            // Every build shape MUST contain a real implementer - a non-read-only,
            // non-authoring task with no code-writer is the "no implementor" bug.
            const impl = nodes.filter(n => n.type === 'agent').map(n => n.label).filter(l => IMPLEMENTERS.includes(l));
            expect(impl.length).toBeGreaterThan(0);
          }
        });
      }
    });
  });

  // Tricky inputs that previously mis-fired: implementation features that happen to
  // contain an intent word ("audit logging", "a service that evaluates X"), and intent
  // requests whose subject contains strong domain nouns ("Research ... GraphQL API").
  describe('tricky inputs (no false positives)', () => {
    const TRAPS = [
      ['Implement a billing system with full audit logging and compliance reporting', 'generic'],
      ['Add an audit trail to the user service', 'generic'],
      ['Build a page to compare subscription plans', 'ui'],
      ['Write a service that evaluates loan applications', 'generic'],
      ['Review the billing module for performance problems', 'review'],
      ['Research whether to use GraphQL for the public API', 'research'],
      ['Audit the payment service for security vulnerabilities', 'review'],
      // "X vs Y" as a list separator in a build/feature must NOT route to research.
      ['Build a settings page with a light vs dark mode and a compact vs comfortable layout', 'ui'],
      ['Measure log and metric volume to forecast the monthly cost per service', 'analysis'],
      // Consolidation / dedup is a refactor (intent over domain), no infra noise here.
      ['Consolidate the duplicated validation logic across five modules into one shared helper, with behavioral equivalence and no functional changes', 'refactoring'],
    ];
    TRAPS.forEach(([input, expected], i) => {
      it('#' + i + ' -> ' + expected + ': ' + input, () => {
        resetState();
        win.document.getElementById('storyInput').value = input;
        win.generateFromStory();
        assertStructural(win.state.nodes, win.state.connections);
        expect(shapeOf(win.state.nodes)).toBe(expected);
      });
    });
  });

  // Fleshed-out, Jira-sized tickets (multi-paragraph + acceptance criteria) - check that
  // realistic inputs land on a reasonable shape, pull review loops in for complex builds,
  // feed acceptance criteria into the gate, and keep read-only intents read-only.
  describe('realistic Jira-sized tickets', () => {
    const T = {
      fullstack: `Build the team workspaces feature end to end. Add REST API endpoints for workspace CRUD and membership plus database migrations. Add a frontend dashboard with a navbar switcher, a members table, and an invite modal following the design system, with role-based gating and auth.\n\nAcceptance criteria:\n- Owners can invite and remove members\n- Viewers have read-only access\n- Switching workspaces updates the active context`,
      bug: `Customers are being charged twice intermittently on the checkout flow. We have had about a dozen reports this week. It happens when the payment confirmation request times out and the client retries the call. As a result the webhook handler processes the same event more than once. This is a high-severity production bug that affects revenue and customer trust. We suspect a missing idempotency key on the payment service. The regression appeared after the retry changes last sprint.\n\nAcceptance criteria:\n- Duplicate charges no longer occur under retry or timeout conditions\n- A regression test reproduces the double charge and passes after the fix\n- Existing successful single charges are unaffected`,
      research: `Spike: evaluate options for our real-time notification delivery system at scale. Compare WebSockets versus Server-Sent Events versus a managed service. Consider cost and operational complexity.\n\nAcceptance criteria:\n- A recommendation with rationale\n- A scored comparison matrix\n\nResearch only, no implementation.`,
      review: `Audit the new billing service for security, performance, and code quality before launch. It handles payment data and will be on the hot path. Produce a prioritized list of findings.\n\nAcceptance criteria:\n- Findings categorized by severity\n- A go or no-go recommendation\n\nRead-only review, do not change code.`,
      data: `Migrate the legacy users table to the new normalized schema with zero downtime. Backfill existing data, dual-write during transition, then cut over.\n\nAcceptance criteria:\n- Migration is reversible\n- No downtime during rollout\n- All existing user data is preserved and validated`,
      docs: `Document the public REST API for the v2 launch. Cover authentication, all endpoints with request and response examples, rate limits, and error codes. Generate an OpenAPI spec.\n\nAcceptance criteria:\n- Every public endpoint documented with examples\n- OpenAPI spec generated`,
      // Bug-report structure (Recreation/Expected/Actual) must win over incidental UI words
      // ("toolbar", "header", "renders") used descriptively in the bug prose.
      // Infra provisioning: detected from body provisioning vocab even though the
      // CI/Release-pipeline mentions (the usual DevOps tell) are stripped by denoise, and
      // "database"/"service" repeated many times do not inflate API past the cap.
      infra: `Background\nProvision a new standalone managed database instance and storage account for the location service. The original approach of adding a container to the shared managed instance is no longer viable, so we are standing up a net-new instance from scratch. Telemetry and monitoring on the shared instance will not carry over and must be re-established.\n\nLogistics\nBuild Pipeline: CI Build\nRelease Pipelines: Android, iOS, Desktop\n\nPromises Made\nA standalone database instance is provisioned for STAGE and PROD.\nA storage account is provisioned to support the instance.\nEnvironment configuration (the connection string) is set up for both environments.\nConnectivity from the service to the database is validated and basic smoke testing confirms the configuration works.`,
      bugReport: `Background\nA feature gate is bypassed on one surface. The shipped fix gated the toolbar and the detail header, but two completed-list consumers were missed, so the entry point still shows.\n\nRecreation steps\nSet the flag false. Open the completed list and a completed item. Observe the entry point is still shown.\n\nExpected results\nWith the flag false, the entry point is hidden on the completed-list surface.\n\nActual results\nThe two consumers render the action unconditionally; the gate selector was not wired in.\n\nProposed fix\nWire the same gate selector into the two consumers and add unit tests, mirroring the active-surface tests.`,
    };
    const run = key => { resetState(); win.document.getElementById('storyInput').value = T[key]; win.generateFromStory(); return win.state.nodes; };
    const labelsOf = ns => ns.filter(n => n.type === 'agent').map(n => n.label);
    const decisionCond = ns => { const d = ns.find(n => n.type === 'decision'); return d ? d.config.condition : ''; };

    it('full-stack feature -> parallel backend+frontend build with a Skeptic and AC gate', () => {
      const ns = run('fullstack'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('fullstack');
      expect(labelsOf(ns).some(l => /Skeptic/.test(l))).toBe(true);
      expect(decisionCond(ns)).toContain('invite and remove members');
    });
    it('production bug -> bugfix with Skeptic + Verifier and AC gate', () => {
      const ns = run('bug'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('bugfix');
      const labels = labelsOf(ns);
      expect(labels.some(l => /Skeptic/.test(l))).toBe(true);
      expect(labels.some(l => /Verification/.test(l))).toBe(true);
      expect(decisionCond(ns)).toContain('Duplicate charges');
    });
    it('research spike -> read-only research report, no code writers', () => {
      const ns = run('research'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('research');
      expect(ns.find(n => n.type === 'output').config.format).toBe('report');
      expect(labelsOf(ns).filter(l => CODE_WRITERS.includes(l)).length).toBe(0);
    });
    it('audit -> read-only review report with a Security Auditor', () => {
      const ns = run('review'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('review');
      expect(ns.find(n => n.type === 'output').config.format).toBe('report');
      expect(labelsOf(ns).some(l => /Security Auditor/.test(l))).toBe(true);
      expect(labelsOf(ns).filter(l => CODE_WRITERS.includes(l)).length).toBe(0);
    });
    it('data migration -> Migration Engineer with reversibility AC in the gate', () => {
      const ns = run('data'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('data');
      expect(decisionCond(ns)).toContain('reversible');
    });
    it('documentation -> docs output, no code-review gate', () => {
      const ns = run('docs'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('documentation');
      expect(ns.find(n => n.type === 'output').config.format).toBe('docs');
    });
    it('bug-report structure wins over incidental UI words -> bugfix, not UI', () => {
      const ns = run('bugReport'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('bugfix');
      expect(ns.find(n => n.type === 'output').config.format).toBe('code');
    });
    it('infra provisioning -> DevOps (provision vocab wins; "database"/"service" repetition capped)', () => {
      const ns = run('infra'); assertStructural(ns, win.state.connections);
      expect(shapeOf(ns)).toBe('devops');
    });
  });

  // A real-Jira-shaped ticket carries metadata sections (Logistics, CI/Release pipelines,
  // "Database Changes: None") whose stray keywords must NOT hijack the detected intent.
  // Genericized (no real ticket content) but structured like one.
  describe('boilerplate-heavy ticket does not hijack intent (denoise)', () => {
    const TICKET = [
      'Background',
      'Users sometimes lose unsaved work when the app moves to the background and the OS suspends it. We want to flush pending work before suspension so nothing is lost.',
      '',
      'Objective',
      'Drain the pending write queue before the app is allowed to suspend, and re-enable it on resume.',
      '',
      'Logistics',
      'Repo: example_mobile_app',
      'Build Pipeline: Mobile CI Build',
      'Release Pipelines: Android Release Pipeline, iOS Release Pipeline, Desktop Release Pipeline',

describe('Auto Workflow: default-to-build guard (no silent read-only inference)', () => {
  beforeEach(() => { resetState(); });
  const IMPLEMENTERS = ['Implementer', 'Fixer', 'Backend Dev', 'Frontend Dev', 'UI Implementer', 'Optimizer', 'Migration Engineer', 'Refactorer', 'DevOps Engineer'];
  function gen(text) {
    win.document.getElementById('storyInput').value = text;
    win.generateFromStory();
    return win.state.nodes.filter(n => n.type === 'agent').map(n => n.label);
  }
  const hasImpl = labels => labels.some(l => IMPLEMENTERS.includes(l));

  // Build tasks whose acceptance criteria are thick with test/doc vocabulary must
  // still produce an implementer - they must not be hijacked into a read-only shape.
  const BUILD_WITH_READONLY_VOCAB = [
    'Make all three config options actually influence the generated output. The full test suite still passes, plus new tests proving each non-default value alters output and each default stays byte-identical.',
    'Add a retry mechanism to the payment client with backoff. Acceptance: unit tests cover the backoff schedule, integration tests verify the retry path, and the full test suite passes.',
    'Add a configurable rate limiter to the public API so abusive clients are throttled. Acceptance: unit and integration tests pass; 429 returned after the threshold.',
    'Implement a new /health endpoint that reports service status. Document the endpoint in the API reference once it works.',
  ];
  BUILD_WITH_READONLY_VOCAB.forEach((text, i) => {
    it('#' + i + ' build task keeps an implementer despite read-only vocabulary', () => {
      const labels = gen(text);
      expect(hasImpl(labels)).toBe(true);
      expect(labels).toNotContain('Test Suite Writer');
    });
  });

  // Genuine authoring / read-only requests are NOT demoted: the guard only fires
  // when the read-only deliverable signal is absent or out-weighed by build signal.
  it('genuine "write tests" stays a test-authoring workflow', () => {
    const labels = gen('Write unit and integration tests for the checkout flow to raise coverage above 80 percent.');
    expect(labels).toContain('Test Suite Writer');
    expect(hasImpl(labels)).toBe(false);
  });
  it('genuine research spike stays read-only', () => {
    const labels = gen('Evaluate options for real-time delivery and compare WebSockets versus SSE versus a managed service. Produce a recommendation. Research only, no implementation.');
    expect(hasImpl(labels)).toBe(false);
    expect(labels).toContain('Synthesizer');
  });
  it('genuine audit stays read-only', () => {
    const labels = gen('Audit the new billing service for security and performance. Produce a prioritized list of findings. Read-only review, do not change code.');
    expect(hasImpl(labels)).toBe(false);
  });
});

      toggle.click();

      // shows the effective prompt read-only (in a <pre>, not a textarea)
      const pre = preview.querySelector('pre');

      expect(preview.querySelector('textarea')).toBeNull();

      prompt.dispatchEvent(new win.Event('focus'));
      expect(prompt.classList.contains('focused')).toBe(true);
      prompt.dispatchEvent(new win.Event('blur'));

      expect(prompt.value).toBe(beforeVal);

describe('Implementer Template Additions', () => {
  // R4: implementer gains both lines additively; other templates unchanged
  it('implementer template gains the minimality and record-assumptions lines additively, preserving prior text', () => {
    const t = win.PROMPTS.implementer;
    expect(t).toContain('Make the minimal change that satisfies the plan');

    expect(t).toContain('Implement the feature following the plan.');
    expect(t).toContain('**Unresolved**: Anything that needs reviewer attention or was deferred');
    // both additions sit before the Handoff Summary
    const handoffIdx = t.indexOf('## Handoff Summary');
    expect(t.indexOf('Make the minimal change that satisfies the plan') < handoffIdx).toBe(true);
    expect(t.indexOf('do not silently guess') < handoffIdx).toBe(true);
  });
  it('other role templates are unchanged by the implementer edit', () => {

    });
  });

  // R5: new substrings are em/en-dash free and fence-free
  it('implementer template additions are em/en-dash free and fence-free', () => {
    const minimality = 'Make the minimal change that satisfies the plan - implement what is asked and do not refactor or restructure unrelated code along the way.';
    const assumptions = 'If something is ambiguous or you are blocked, do not silently guess: proceed with the most reasonable interpretation and state the assumption explicitly in your Handoff Summary so the next agent can correct it.';

      expect(s).toNotContain('—'); // em dash
      expect(s).toNotContain('–'); // en dash

});

// ─── Suite 17: Auto Layout ──────────────────────────────
describe('Auto Layout', () => {
  beforeEach(() => { clearStorage(); resetState(); });

  describe('linear chain', () => {
    it('should place nodes left-to-right in ascending x order', () => {
      const refs = buildTestWorkflow('linear');
      win.autoLayout();
      expect(refs.input.x < refs.planner.x).toBe(true);
      expect(refs.planner.x < refs.implementer.x).toBe(true);
      expect(refs.implementer.x < refs.output.x).toBe(true);
    });

    it('should place all nodes on the same y (single row)', () => {
      const refs = buildTestWorkflow('linear');
      win.autoLayout();
      expect(refs.input.y).toBe(refs.planner.y);
      expect(refs.planner.y).toBe(refs.implementer.y);
      expect(refs.implementer.y).toBe(refs.output.y);
    });

    it('should assign each layer a unique x position', () => {
      const refs = buildTestWorkflow('linear');
      win.autoLayout();
      const xs = [refs.input.x, refs.planner.x, refs.implementer.x, refs.output.x];
      const unique = new Set(xs);
      expect(unique.size).toBe(4);
    });
  });

  describe('decision loop', () => {
    it('should place output node rightmost (last layer)', () => {
      const refs = buildTestWorkflow('decision');
      win.autoLayout();
      const allX = win.state.nodes.map(n => n.x);
      const maxX = Math.max(...allX);
      expect(refs.output.x).toBe(maxX);
    });

    it('should not corrupt layer ordering from back-edge', () => {
      const refs = buildTestWorkflow('decision');
      win.autoLayout();
      expect(refs.input.x < refs.implementer.x).toBe(true);
      expect(refs.implementer.x < refs.reviewer.x).toBe(true);
      expect(refs.reviewer.x < refs.decision.x).toBe(true);
      expect(refs.decision.x < refs.tester.x).toBe(true);
      expect(refs.tester.x < refs.output.x).toBe(true);
    });
  });

  describe('parallel fork', () => {
    it('should place forked branches on the same x layer', () => {
      const refs = buildTestWorkflow('parallel');
      win.autoLayout();
      expect(refs.backend.x).toBe(refs.frontend.x);
    });

    it('should place forked branches at different y positions', () => {
      const refs = buildTestWorkflow('parallel');
      win.autoLayout();
      expect(refs.backend.y === refs.frontend.y).toBe(false);
    });

    it('should place reviewer after both branches', () => {
      const refs = buildTestWorkflow('parallel');
      win.autoLayout();
      expect(refs.reviewer.x > refs.backend.x).toBe(true);
      expect(refs.reviewer.x > refs.frontend.x).toBe(true);
    });
  });

  describe('complex workflow', () => {
    it('should place output as rightmost node', () => {
      const refs = buildTestWorkflow('complex');
      win.autoLayout();
      const allX = win.state.nodes.map(n => n.x);
      const maxX = Math.max(...allX);
      expect(refs.output.x).toBe(maxX);
    });

    it('should place parallel branches on a shared layer', () => {
      const refs = buildTestWorkflow('complex');
      win.autoLayout();
      expect(refs.backend.x).toBe(refs.frontend.x);
    });

    it('should place reviewer after latest branch in fork-join convergence', () => {
      const refs = buildTestWorkflow('complex');
      win.autoLayout();
      expect(refs.reviewer.x > refs.backend.x).toBe(true);
      expect(refs.reviewer.x > refs.frontend.x).toBe(true);
    });

    it('should place decision gate after reviewer and tester after decision', () => {
      const refs = buildTestWorkflow('complex');
      win.autoLayout();
      expect(refs.decision.x > refs.reviewer.x).toBe(true);
      expect(refs.tester.x > refs.decision.x).toBe(true);
    });
  });

  describe('edge cases', () => {
    it('should not throw on empty state', () => {
      resetState();
      let threw = false;
      try { win.autoLayout(); } catch (e) { threw = true; }
      expect(threw).toBe(false);
    });

    it('should position single node without error', () => {
      resetState();
      const n = win.addNode('agent', 0, 0, 'Solo', { agentType:'coder', model:'opus-4.6', tools:['Read'], prompt:'Go.', maxTurns:5 });
      win.autoLayout();
      expect(typeof n.x).toBe('number');
      expect(typeof n.y).toBe('number');
    });

    it('should position all disconnected nodes', () => {
      resetState();
      const a = win.addNode('agent', 0, 0, 'A', { agentType:'coder', model:'opus-4.6', tools:['Read'], prompt:'A.', maxTurns:5 });
      const b = win.addNode('agent', 0, 0, 'B', { agentType:'coder', model:'opus-4.6', tools:['Read'], prompt:'B.', maxTurns:5 });
      win.autoLayout();
      expect(typeof a.x).toBe('number');
      expect(typeof b.x).toBe('number');
    });
  });
});

      expect(vf.config.prompt).toBe(win.PROMPTS.verifier);
    });
    it('should create critic + decision + revise loop on attach', () => {
      const { target, out } = buildTargetWithDownstream();
      win.attachAdversary(target.id);
      const critic = attached(target.id);
      expect(!!critic).toBe(true);
      expect(critic.config.agentType).toBe('adversary');
      expect(critic.config.adversaryRole).toBe('coder');
      expect(critic.label).toContain('Skeptic review:');
      const decision = win.state.nodes.find(n => n.config && n.config.reviewLoopDecisionFor === target.id);
      expect(!!decision).toBe(true);
      expect(decision.config.yesLabel).toBe('Passed');
      expect(decision.config.noLabel).toBe('Needs revision');
      expect(decision.config.maxRevisions).toBe(3);
      const conns = win.state.connections;
      expect(!!conns.find(c => c.from === target.id && c.to === critic.id)).toBe(true);
      expect(!!conns.find(c => c.from === critic.id && c.to === decision.id)).toBe(true);
      expect(!!conns.find(c => c.from === decision.id && c.to === target.id && c.label === 'Needs revision')).toBe(true);
      expect(!!conns.find(c => c.from === decision.id && c.to === out.id && c.label === 'Passed')).toBe(true);
      // The target's original direct edge to the downstream is rerouted away.
      expect(!!conns.find(c => c.from === target.id && c.to === out.id)).toBe(false);
    });
    it('should be undoable in a single step', () => {
      const { target, out } = buildTargetWithDownstream();
      const nodesBefore = win.state.nodes.length;

      expect(win.state.nodes.length).toBe(nodesBefore);
      expect(win.state.connections.length).toBe(connsBefore);
      expect(attached(target.id)).toBe(undefined);
      expect(!!win.state.connections.find(c => c.from === target.id && c.to === out.id)).toBe(true);
    });
    it('should restore the original downstream on detach', () => {
      const { target, out } = buildTargetWithDownstream();
      const nodesBefore = win.state.nodes.length;
      win.attachAdversary(target.id);
      win.detachAdversary(target.id);
      expect(win.state.nodes.length).toBe(nodesBefore);
      expect(attached(target.id)).toBe(undefined);
      expect(win.state.nodes.find(n => n.config && n.config.reviewLoopDecisionFor === target.id)).toBe(undefined);
      expect(!!win.state.connections.find(c => c.from === target.id && c.to === out.id)).toBe(true);
    });
    it('should not double-attach', () => {
      const { target } = buildTargetWithDownstream();
      win.attachAdversary(target.id);
      win.attachAdversary(target.id);
      const critics = win.state.nodes.filter(n => n.config && n.config.reviewLoopFor === target.id);

    it('toggle should attach then detach the same node', () => {

      expect(!!attached(target.id)).toBe(true);

      win.toggleAdversarialReview();
      expect(attached(target.id)).toBe(undefined);
    });
  });

      expect(!!win.state.connections.find(c => c.from === decision.id && c.to === out.id && c.label === 'Verified')).toBe(true);
    });
    it('verifier attach is undoable in a single step', () => {
      const { target } = buildTarget();
      const nodesBefore = win.state.nodes.length;
      win.attachReviewLoop(target.id, 'verifier');
      expect(win.state.nodes.length).toBe(nodesBefore + 2);
      win.undo();
      expect(win.state.nodes.length).toBe(nodesBefore);
      expect(loopOn(target.id)).toBe(undefined);
    });
    it('detaches a verifier loop and restores the downstream', () => {
      const { target, out } = buildTarget();
      win.attachReviewLoop(target.id, 'verifier');
      win.detachReviewLoop(target.id);
      expect(loopOn(target.id)).toBe(undefined);
      expect(!!win.state.connections.find(c => c.from === target.id && c.to === out.id)).toBe(true);
    });
    it('allows only one loop per node (no skeptic + verifier stacking)', () => {
      const { target } = buildTarget();
      win.attachReviewLoop(target.id, 'adversary');
      win.attachReviewLoop(target.id, 'verifier'); // should be a no-op
      const loops = win.state.nodes.filter(n => n.config && n.config.reviewLoopFor === target.id);
      expect(loops.length).toBe(1);
      expect(loops[0].config.reviewLoopKind).toBe('adversary');
    });
    it('cannot attach a review loop to a Skeptic or Verifier node', () => {
      resetState();
      const skeptic = win.addNode('agent', 100, 100, 'S', { agentType: 'adversary' });
      const verifier = win.addNode('agent', 100, 200, 'V', { agentType: 'verifier' });
      const agent = win.addNode('agent', 100, 300, 'A', { agentType: 'coder' });
      expect(win.canAttachReviewLoop(skeptic)).toBe(false);
      expect(win.canAttachReviewLoop(verifier)).toBe(false);

    });
    it('renders the verifier prompt and its loop in genWorkflow', () => {

      expect(output).toContain('You are a verifier');
      expect(output).toContain('Not verified');

    it('keeps the Skeptic working through the generalized family', () => {

      expect(s.label).toContain('Skeptic review:');
    });
  });

  describe('review-loop reroute (back-edge target)', () => {
    function buildChain() {
      resetState();
      const planner = win.addNode('agent', 100, 100, 'Planner', { agentType: 'planner' });
      const impl = win.addNode('agent', 400, 100, 'Builder', { agentType: 'coder' });
      const out = win.addNode('output', 900, 100, 'Result');
      win.addConnection(planner.id, impl.id);
      win.addConnection(impl.id, out.id);
      win.attachReviewLoop(impl.id, 'verifier');
      const decision = win.state.nodes.find(n => n.config && n.config.reviewLoopDecisionFor === impl.id);
      return { planner, impl, out, decision };
    }
    function backEdge(decision) {
      return win.state.connections.find(c => c.from === decision.id && c.label === decision.config.noLabel);
    }
    it('defaults the failure branch to the reviewed node', () => {
      const { impl, decision } = buildChain();
      expect(backEdge(decision).to).toBe(impl.id);
    });
    it('re-points the failure branch to a chosen node', () => {
      const { planner, impl, decision } = buildChain();
      win.setReviewLoopBackTarget(decision.id, planner.id);
      expect(backEdge(decision).to).toBe(planner.id);
      // The pass branch is untouched (still forwards to the original downstream).
      expect(!!win.state.connections.find(c => c.from === decision.id && c.label === 'Verified')).toBe(true);
    });
    it('is undoable in a single step', () => {
      const { planner, impl, decision } = buildChain();
      win.setReviewLoopBackTarget(decision.id, planner.id);
      win.undo();
      expect(backEdge(decision).to).toBe(impl.id);
    });
    it('is a no-op for a non-review-loop decision', () => {
      resetState();
      const a = win.addNode('agent', 100, 100, 'A', { agentType: 'coder' });
      const d = win.addNode('decision', 300, 100, 'Plain gate', { yesLabel: 'Yes', noLabel: 'No' });
      win.addConnection(d.id, a.id, 'No');
      win.setReviewLoopBackTarget(d.id, a.id); // no reviewLoopDecisionFor -> no-op, no throw
      expect(win.state.connections.find(c => c.from === d.id && c.label === 'No').to).toBe(a.id);
    });
    it('the rerouted target survives serialize/deserialize', () => {
      const { planner, decision } = buildChain();
      win.setReviewLoopBackTarget(decision.id, planner.id);
      const json = win.serializeWorkflow();
      resetState();
      win.deserializeWorkflow(json);
      const d2 = win.state.nodes.find(n => n.config && n.config.reviewLoopDecisionFor !== undefined);
      const be = win.state.connections.find(c => c.from === d2.id && c.label === d2.config.noLabel);
      const planner2 = win.state.nodes.find(n => n.label === 'Planner');
      expect(be.to).toBe(planner2.id);
    });
    it('the generated workflow re-runs the rerouted node on failure', () => {
      const { planner, decision } = buildChain();
      win.setReviewLoopBackTarget(decision.id, planner.id);
      expect(win.genWorkflow()).toContain('Planner');
      expect(win.genWorkflow()).toContain('Not verified');
    });
    it('detach still restores the original downstream after a reroute', () => {
      const { planner, impl, out, decision } = buildChain();
      win.setReviewLoopBackTarget(decision.id, planner.id);
      win.detachReviewLoop(impl.id);
      expect(win.state.nodes.find(n => n.config && n.config.reviewLoopFor === impl.id)).toBe(undefined);
      expect(!!win.state.connections.find(c => c.from === impl.id && c.to === out.id)).toBe(true);
    });
  });

        win.loadPreset('feature');
        win.state.exportFormat = fmt;
        win.updatePrompt();
        const expected = win.getRawPrompt();
        let copied = '';
        win.navigator.clipboard.writeText = (t) => { copied = t; return Promise.resolve(); };
        win.copyPrompt();
        expect(copied).toBe(expected);
      });
    });
    it('should never copy HTML tags for rendered formats', () => {
      win.loadPreset('feature');
      win.state.exportFormat = 'prompt';
      win.updatePrompt();
      let copied = '';
      win.navigator.clipboard.writeText = (t) => { copied = t; return Promise.resolve(); };
      win.copyPrompt();
      expect(copied.includes('<h2>')).toBe(false);
      expect(copied.includes('<strong>')).toBe(false);
      expect(copied.includes('<p>')).toBe(false);
    });
  });

  describe('renderMarkdown', () => {
    it('should return empty string for empty input', () => {
      expect(win.renderMarkdown('')).toBe('');
    });
    it('should render headers', () => {
      const html = win.renderMarkdown('## Test Header');
      expect(html).toContain('<h2>');
    });
    it('should render bold', () => {
      const html = win.renderMarkdown('This is **bold**');
      expect(html).toContain('<strong>bold</strong>');
    });
    it('should render code blocks', () => {
      const html = win.renderMarkdown('```\ncode here\n```');
      expect(html).toContain('<pre>');
    });
  });
});

describe('Atlassian ticket resolution (comprehensive read; wider context is agency)', () => {
  it('requires a comprehensive read of the input ticket (incl. comments + attachments), not forced wider work', () => {
    const out = win.atlassianTicketFetchHint(['https://foo.atlassian.net/browse/TEST-1']);
    expect(out).toContain('resolved ticket is the spec'); // original core preserved verbatim
    // required: comprehensive read of the INPUT ticket
    expect(out).toContain('acceptance criteria');
    expect(out).toContain('comments');
    expect(out).toContain('attachments');
    expect(out).toContain('follow any links'); // agency to follow helpful links (ticket or requirements)
    expect(out).toContain('sharpen the plan'); // the orchestrator (plan-maker) also has dig-deeper agency
    // neither a forced deep-pull nor a scope mandate - that wording is gone; wider-context agency lives in atlassianGeneralHint
    expect(out).toNotContain('do not pick up sibling');
    expect(out).toNotContain('full agency to dig deeper');
  });
  it('atlassianGeneralHint still carries the optional dig-deeper agency (Confluence + linked issues)', () => {
    win.state.mcpAtlassian = true;
