  it('OpenSpec export of a mid-chain loop keeps the dependency chain (no orphan root artifact)', () => {
    buildMidChainLoop();
    const y = win.buildOpenSpecSchema().schemaYaml;
    const stanzaStart = y.indexOf('- id: tester');
    const nextStanza = y.indexOf('- id:', stanzaStart + 1);
    const stanza = y.slice(stanzaStart, nextStanza < 0 ? y.indexOf('\napply:') : nextStanza);
    expect(stanzaStart >= 0).toBe(true);
    expect(/requires:\s*\n\s*- skeptic-review-coder/.test(stanza)).toBe(true);
    expect(stanza).toNotContain('requires: []');
    expect(/apply:\s*\n\s*requires:\s*\n\s*- tester\b/.test(y)).toBe(true);
    expect(y).toContain('tracks: tester.md');
  });
});

describe('Undo coverage: text edits and select-clicks', () => {
  function selectAndGetPromptField() {
    resetState();
    const n = win.addNode('agent', 300, 200, 'Editable', { agentType:'coder', model:'opus-4.8', tools:['Read','Write'], prompt:'original text', maxTurns:10 });
    win.selectNode(n.id);
    win.updateConfig();
    win.clearUndo();
    const field = win.document.querySelector('#configFields textarea[data-key="prompt"]');
    return { n, field };
  }
  function typeInto(field, text) {
    field.value = text;
    field.dispatchEvent(new win.Event('input', { bubbles: true }));
  }
  it('a typing burst is ONE undo entry: single undo restores the pre-edit text', () => {
    const { n, field } = selectAndGetPromptField();
    const depth0 = win.undoDepth();
    typeInto(field, 'original text plus');
    typeInto(field, 'original text plus more');
    typeInto(field, 'original text plus more still');
    expect(win.undoDepth()).toBe(depth0 + 1);   // three keystrokes, one session snapshot
    expect(n.config.prompt).toBe('original text plus more still');
    win.undo();
    expect(win.state.nodes.find(x => x.id === n.id).config.prompt).toBe('original text');
  });
  it('redo round-trips the text edit', () => {
    const { n, field } = selectAndGetPromptField();
    typeInto(field, 'changed');
    win.undo();
    expect(win.state.nodes.find(x => x.id === n.id).config.prompt).toBe('original text');
    win.redo();
    expect(win.state.nodes.find(x => x.id === n.id).config.prompt).toBe('changed');
  });
  it('blur ends the session: the next burst is its own undo entry', () => {
    const { n, field } = selectAndGetPromptField();
    typeInto(field, 'first burst');
    field.dispatchEvent(new win.Event('blur', { bubbles: true }));
    typeInto(field, 'second burst');
    win.undo();
    expect(win.state.nodes.find(x => x.id === n.id).config.prompt).toBe('first burst');
    win.undo();
    expect(win.state.nodes.find(x => x.id === n.id).config.prompt).toBe('original text');
  });
  it('a structural change after a text edit undoes independently (text edit survives, then reverts)', () => {
    const { n, field } = selectAndGetPromptField();
    typeInto(field, 'edited');
    win.addNode('agent', 500, 200, 'Later', { agentType:'general', model:'opus-4.8', tools:['Read'], prompt:'', maxTurns:5 });
    win.undo();   // removes Later
    expect(win.state.nodes.find(x => x.label === 'Later')).toBe(undefined);
    expect(win.state.nodes.find(x => x.id === n.id).config.prompt).toBe('edited');
    win.undo();   // reverts the text edit
    expect(win.state.nodes.find(x => x.id === n.id).config.prompt).toBe('original text');
  });
  it('a select-click storm consumes ZERO undo slots', () => {
    resetState();

    const b = win.addNode('agent', 500, 200, 'B', { agentType:'coder', model:'opus-4.8', tools:['Read'], prompt:'', maxTurns:5 });

    return { a, b, d };

  function seededReport() {
    return { workflow: win.getName() || 'workflow',
      steps: [ { slug:'planner', status:'done', turns:4, cap:10 },
               { slug:'builder', status:'done', turns:10, cap:10 },

      expect(out).toContain('never invent numbers');
    });
  });
  it('the SDK gets only the one-line convention comment, not the directive', () => {

  it('the OpenSpec apply instruction carries the fence and the reverse-grounding breadcrumb', () => {

    win.addConnection(win.state.nodes.find(n => n.label === 'Review Passed').id, out.id, 'Yes');

    expect(schema.schemaYaml).toContain('do not create `.workflow/` or any files if the system is absent');

  it('parseRunReport: raw fence, fence embedded in a record, garbage, and absent all behave', () => {
    const fence = '```awd:run\n{"workflow":"w","steps":[{"slug":"a","status":"done"}]}\n```';
    expect(win.parseRunReport(fence).steps.length).toBe(1);
    const md = '# A record\n\nSome prose.\n\n' + fence + '\n\nMore prose.';
    expect(win.parseRunReport(md).workflow).toBe('w');
    expect(win.parseRunReport('```awd:run\nnot json\n```')).toBe(null);
    expect(win.parseRunReport('no fence here')).toBe(null);
    expect(win.parseRunReport('```awd:run\n{"workflow":"w"}\n```')).toBe(null);
  });
  it('ingestion aggregates stats, counts cap hits, and collects unmatched slugs', () => {
    seedWorkflow();

    win.ingestRunReport(seededReport());

    expect(wf.nodes['planner'].runs).toBe(2);
    expect(wf.nodes['planner'].capHits).toBe(0);
    expect(wf.nodes['builder'].capHits).toBe(2);
    expect(wf.nodes['ghost-step'].failures).toBe(2);
    expect(wf.nodes['review-passed'].cycleRuns).toBe(2);
    expect(wf.nodes['review-passed'].cycleSum).toBe(4);
    expect(wf.unmatched.includes('ghost-step')).toBe(true);
    expect(wf.unmatched.length).toBe(1);
  });
  it('badges and the config Run history line appear with stats and are absent without', () => {
    const { b } = seedWorkflow();

    expect(win.document.querySelectorAll('.run-stats-badge').length).toBe(0);
    win.ingestRunReport(seededReport());
    win.render();
    expect(win.document.querySelectorAll('.run-stats-badge').length).toBeGreaterThan(0);
    win.selectNode(b.id); win.updateConfig();
    expect(!!win.document.querySelector('.config-run-history')).toBe(true);
    win.localStorage.removeItem('awd_run_reports');
    win.render(); win.updateConfig();
    expect(win.document.querySelectorAll('.run-stats-badge').length).toBe(0);
    expect(!!win.document.querySelector('.config-run-history')).toBe(false);

    const bare = { name: 'records', getDirectoryHandle: async () => { throw new Error('no'); } };

describe('Agent Context round-trip through OpenSpec (export -> foreign import -> re-export)', () => {
  it('openSpecExtractAgentContext splits the block out of the prompt (and none present -> notes empty)', () => {
    const r = win.openSpecExtractAgentContext('Do the work.\n\nAgent Context:\nUse src/api.\n\nIntended execution parameters (a runtime honors what it can):\n- Role: General');
    expect(r.notes).toBe('Use src/api.');
    expect(r.prompt).toContain('Do the work.');
    expect(r.prompt).toContain('Intended execution parameters');   // trailing block preserved in prompt
    expect(r.prompt).toNotContain('Agent Context:');                // block removed from the prompt
    const none = win.openSpecExtractAgentContext('Just a plain instruction.');
    expect(none.notes).toBe('');
    expect(none.prompt).toBe('Just a plain instruction.');
  });
  it('a foreign description is NOT mapped into Agent Context (metadata, not agent context)', () => {
    const yaml = ['name: x', 'version: 1', 'artifacts:',
      '  - id: build', '    generates: build.md', '    description: "The build step doc"', '    template: build.md',
      '    instruction: |', '      Build the thing.', ''].join('\n');
    const wf = win.openSpecImportForeign(yaml);
    const agent = wf.canvas.nodes.find(n => n.type === 'agent');
    expect(agent.config.prompt).toContain('Build the thing.');
    expect(agent.config.notes).toBe('');                            // description stays out of Agent Context
  });
  it('export -> foreign import re-populates Agent Context and re-export bundles it once (no dup)', () => {
    resetState();
    const inp = win.addNode('input', 80, 200, 'Spec');
    const a = win.addNode('agent', 340, 200, 'Planner', { agentType:'planner', model:'opus-4.6', tools:['Read'], prompt:'Plan it.', notes:'Our API lives in src/api.', maxTurns:5 });
    const out = win.addNode('output', 600, 200, 'Done', { deliverable:'x', format:'code' });
    win.addConnection(inp.id, a.id); win.addConnection(a.id, out.id);
    const s1 = win.buildOpenSpecSchema();
    // foreign import (simulates a schema whose awd:meta was stripped, e.g. openspec schema fork)
    const wf = win.openSpecImportForeign(s1.schemaYaml);
    const agent = wf.canvas.nodes.find(n => n.config && n.config.notes === 'Our API lives in src/api.');
    expect(!!agent).toBe(true);                                     // Agent Context extracted, not lost
    expect(agent.config.prompt).toNotContain('Agent Context:');     // and not left buried in the prompt
    // re-export the imported workflow -> Agent Context bundled into the instruction exactly once
    win.deserializeWorkflow(wf);
    const s2 = win.buildOpenSpecSchema();
    expect((s2.schemaYaml.match(/Agent Context:/g) || []).length).toBe(1);
    expect(s2.schemaYaml).toContain('Our API lives in src/api.');
  });
});

  });
});
